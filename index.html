<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>기간별 거래처원장 요청</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#1b2430; --sub:#6b7a90;
    --line:#e2e8f0; --brand:#2563eb; --brand2:#1d4ed8;
    --ok:#059669; --warn:#d97706; --err:#dc2626;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    line-height:1.55;padding:20px 14px 60px}
  .wrap{max-width:760px;margin:0 auto}
  header{margin-bottom:18px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:var(--sub);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
  label{display:block;font-size:13px;font-weight:700;margin:0 0 6px;color:#334155}
  input,select,textarea{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);outline:none;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .row{display:flex;gap:10px}
  .row>div{flex:1}
  .field{margin-bottom:14px}
  .hint{font-size:12px;color:var(--sub);margin-top:5px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;
    font-family:inherit;background:#e8eef8;color:#1e3a8a}
  button.primary{background:var(--brand);color:#fff}
  button.primary:hover{background:var(--brand2)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:12px;padding:11px 12px;border-radius:10px;font-size:13px;white-space:pre-wrap;display:none}
  .msg.show{display:block}
  .msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
  .msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
  .msg.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{background:#f8fafc;font-size:12px;color:#475569;font-weight:700}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .b-wait{background:#fef3c7;color:#92400e}
  .b-ok{background:#d1fae5;color:#065f46}
  .b-err{background:#fee2e2;color:#991b1b}
  .b-off{background:#e2e8f0;color:#475569}
  .foot{color:var(--sub);font-size:12px;text-align:center;margin-top:22px;line-height:1.7}
  a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>기간별 거래처원장</h1>
    <div class="sub">시작일 ~ 종료일을 넣고 [저장]만 누르면, 구글시트의 GAS가 원장 · PDF · 메일을 자동으로 만듭니다.</div>
  </header>

  <div class="card">
    <div class="field">
      <label>① 거래처</label>
      <select id="customer"><option value="">불러오는 중...</option></select>
      <div class="hint">노션 거래처 DB 목록을 그대로 가져옵니다.</div>
    </div>

    <div class="row">
      <div class="field">
        <label>② 시작일</label>
        <input type="date" id="start" />
      </div>
      <div class="field">
        <label>③ 종료일</label>
        <input type="date" id="end" />
      </div>
    </div>

    <div class="field">
      <label>④ 메모 (선택)</label>
      <input type="text" id="memo" placeholder="예: 업체 요청 9월분" />
    </div>

    <div class="btns">
      <button class="primary" id="btnSave">저장 (자동 실행)</button>
      <button id="btnRun">저장 + 지금 바로 실행</button>
      <button id="btnRefresh">목록 새로고침</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <label style="margin-bottom:10px">요청 목록 · 처리 결과</label>
    <div style="overflow:auto">
      <table>
        <thead>
          <tr><th>거래처</th><th>기간</th><th>상태</th><th>결과</th><th>PDF</th></tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="5" style="color:#94a3b8">아직 불러오지 않았습니다.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="hint">최대 <span id="pollMin">5</span>분 안에 자동 실행됩니다. 급하면 [저장 + 지금 바로 실행]을 누르세요.</div>
  </div>

  <div class="foot">
    푸로찜 총판 · 거래처 원장 자동화 V8.0<br>
    이 화면은 GitHub Pages에서 열리는 "입력 도구"입니다. 실제 계산·PDF·메일은 구글 Apps Script가 합니다.
  </div>
</div>

<script>
/* =======================================================================
   ★ 여기 두 줄만 바꾸면 됩니다.
   WEBAPP_URL : Apps Script → 배포 → 웹앱 → 배포 ID 의 /exec 주소
   TOKEN      : GAS CFG.WEBAPP_TOKEN 과 똑같이 (비워두면 검사 안 함)
   ======================================================================= */
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyosa8zr1U3cUOeaVb72rBgo5TAG8tFO0c1KfnHJCvVDRmC1eUNY6OfvEk_Ap0ehFx2/exec';
const TOKEN      = '';

/* ------------------------- 내부 동작 (수정 불필요) ------------------------ */
const $ = (id) => document.getElementById(id);
const msgBox = $('msg');

function show(text, kind) {
  msgBox.className = 'msg show ' + (kind || 'info');
  msgBox.textContent = text;
}
function hide() { msgBox.className = 'msg'; }

function todayIso(offsetDays) {
  const d = new Date();
  d.setDate(d.getDate() + (offsetDays || 0));
  return d.toISOString().slice(0, 10);
}

/* CORS 회피 : Content-Type 을 text/plain 으로 보내면 브라우저가 사전확인(OPTIONS)을 하지 않습니다.
   GAS doPost 는 postData.contents 로 원문을 받으므로 JSON.parse 만 해주면 됩니다. */
async function callGas(payload, useGet) {
  if (!WEBAPP_URL || WEBAPP_URL.indexOf('여기에') >= 0) {
    throw new Error('index.html 위쪽 WEBAPP_URL 을 본인 Apps Script 웹앱 주소로 바꿔주세요.');
  }
  const body = Object.assign({}, payload);
  if (TOKEN) body.token = TOKEN;

  if (useGet) {
    const qs = new URLSearchParams(body).toString();
    const res = await fetch(WEBAPP_URL + '?' + qs, { method: 'GET' });
    return await res.json();
  }

  const res = await fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch (e) { throw new Error('응답을 해석하지 못했습니다. 배포 주소(/exec)와 "액세스 권한: 모든 사용자"를 확인하세요.\n' + text.slice(0, 200)); }
}

async function loadCustomers() {
  const sel = $('customer');
  sel.innerHTML = '<option value="">불러오는 중...</option>';
  try {
    const out = await callGas({ action: 'customers' });
    if (!out.ok) throw new Error(out.error || '거래처를 불러오지 못했습니다.');
    const list = out.customers || [];
    sel.innerHTML = '<option value="">-- 거래처를 고르세요 --</option>' +
      list.map(c => `<option value="${c.id}">${escapeHtml(c.name)}${c.bizNo ? ' · ' + escapeHtml(String(c.bizNo)) : ''}</option>`).join('');
    if (!list.length) show('노션 거래처 DB가 비어 있거나 권한이 없습니다.', 'err');
  } catch (e) {
    sel.innerHTML = '<option value="">불러오기 실패</option>';
    show(e.message, 'err');
  }
}

async function loadRows() {
  const tb = $('rows');
  try {
    const out = await callGas({ action: 'rows' }, true);
    if (!out.ok) throw new Error(out.error || '목록을 불러오지 못했습니다.');
    const rows = (out.rows || []).slice().reverse();
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="5" style="color:#94a3b8">요청이 없습니다. 위에서 기간을 넣고 [저장]을 눌러보세요.</td></tr>';
      return;
    }
    tb.innerHTML = rows.map(r => {
      let cls = 'b-off', label = '대기';
      const res = r.result || '';
      if (res.indexOf('성공') === 0) { cls = 'b-ok'; label = '완료'; }
      else if (res.indexOf('실패') === 0 || res.indexOf('오류') === 0) { cls = 'b-err'; label = '오류'; }
      else if (r.run) { cls = 'b-wait'; label = '실행중'; }
      const pdf = r.pdfUrl
        ? `<a href="${r.pdfUrl}" target="_blank" rel="noopener">열기</a>`
        : '-';
      return `<tr>
        <td>${escapeHtml(r.customerName || '-')}</td>
        <td>${escapeHtml(r.startIso || '-')}<br><span style="color:#94a3b8">~ ${escapeHtml(r.endIso || '-')}</span></td>
        <td><span class="badge ${cls}">${label}</span></td>
        <td style="max-width:220px">${escapeHtml(res || '-')}${r.doneAt ? `<br><span style="color:#94a3b8">${escapeHtml(r.doneAt)}</span>` : ''}</td>
        <td>${pdf}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    tb.innerHTML = `<tr><td colspan="5" style="color:#dc2626">${escapeHtml(e.message)}</td></tr>`;
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
  ));
}

function collect() {
  const customerId = $('customer').value;
  const customerName = $('customer').selectedOptions[0] ? $('customer').selectedOptions[0].textContent.split(' · ')[0] : '';
  const startIso = $('start').value;
  const endIso = $('end').value;

  if (!customerId) throw new Error('거래처를 고르세요.');
  if (!startIso || !endIso) throw new Error('시작일과 종료일을 모두 넣으세요.');
  if (startIso > endIso) throw new Error('시작일이 종료일보다 늦습니다. 날짜를 바꿔주세요.');

  return { customerId, customerName, startIso, endIso, memo: $('memo').value };
}

async function doSave(runNow) {
  hide();
  let p;
  try { p = collect(); } catch (e) { show(e.message, 'err'); return; }

  $('btnSave').disabled = true; $('btnRun').disabled = true;
  show(runNow ? '저장하고 바로 실행하는 중입니다... (30초~1분 걸릴 수 있어요)' : '저장하는 중입니다...', 'info');
  try {
    const out = await callGas(Object.assign({ action: runNow ? 'run' : 'set' }, p));
    if (!out.ok) {
      show((out.error || '실패했습니다.') + (out.summary ? '\n\n' + out.summary : ''), 'err');
    } else {
      show(runNow
        ? ('실행 완료\n' + (out.summary || '') + '\n\nPDF는 구글시트의 원장 탭과 드라이브에서도 확인할 수 있습니다.')
        : ('저장 완료 · 최대 ' + ($('pollMin').textContent) + '분 안에 자동 실행됩니다.\n구글시트 "' + '기간별 원장 설정' + '" 탭에도 같은 내용이 기록되었습니다.'),
        'ok');
    }
    await loadRows();
  } catch (e) {
    show(e.message, 'err');
  } finally {
    $('btnSave').disabled = false; $('btnRun').disabled = false;
  }
}

$('btnSave').addEventListener('click', () => doSave(false));
$('btnRun').addEventListener('click', () => doSave(true));
$('btnRefresh').addEventListener('click', () => { hide(); loadRows(); });

(function init() {
  $('start').value = todayIso(-30);
  $('end').value = todayIso(0);
  loadCustomers();
  loadRows();
})();
</script>

</body>
</html>
